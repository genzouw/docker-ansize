name: zizmor

# 本ワークフローは genzouw/ci-workflows の reusable workflow を呼び出す薄いスタブ。
# ロジックの実体・変更は ci-workflows 側で一元管理する (トリガー定義のみここで持つ)。
# 参照 SHA の更新は Renovate (github-actions manager) が自動で PR を出す。
# 必須チェック (context: "zizmor / zizmor") のため paths フィルタ禁止。
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  zizmor:
    uses: genzouw/ci-workflows/.github/workflows/zizmor.yml@27f66d762f34f530c05e930829e23811b925cb7d # v1.5.9
